<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nueva Contraseña - PAT</title>

    <link
        rel="stylesheet"
        href="css/styles_login.css"
    >

    <link
        rel="icon"
        type="image/png"
        href="./img/Designer_icon.png"
    >

</head>


<body>

<div class="form-container">

    <h2>Nueva Contraseña</h2>


    <form id="resetForm">

        <div class="input-box">

            <input
                type="password"
                id="newPassword"
                placeholder=" "
                required
            >

            <span>Nueva Contraseña</span>

        </div>


        <div class="input-box">

            <input
                type="password"
                id="confirmPassword"
                placeholder=" "
                required
            >

            <span>Confirmar Contraseña</span>

        </div>


        <button
            type="submit"
            class="submit-btn"
        >
            Guardar
        </button>

    </form>

</div>


<script>

const API_URL = "http://127.0.0.1:8000";


// ==========================================
// OBTENER TOKEN DE LA URL
// ==========================================

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const token =
    urlParams.get("token");


if (!token) {

    alert(
        "Token no válido o ausente. " +
        "Solicita la recuperación de nuevo."
    );


    window.location.href =
        "solicitar_recuperacion.html";
}


// ==========================================
// RESTABLECER CONTRASEÑA
// ==========================================

document
    .getElementById("resetForm")
    .addEventListener("submit", async (e) => {

        e.preventDefault();


        const newPassword =
            document
                .getElementById("newPassword")
                .value;


        const confirmPassword =
            document
                .getElementById("confirmPassword")
                .value;


        // ==========================================
        // VALIDAR CONTRASEÑAS
        // ==========================================

        if (
            newPassword !==
            confirmPassword
        ) {

            alert(
                "Las contraseñas no coinciden."
            );

            return;
        }


        if (newPassword.length < 8) {

            alert(
                "La contraseña debe tener mínimo 8 caracteres."
            );

            return;
        }


        try {

            const response = await fetch(
                `${API_URL}/auth/reset-password`,
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        token: token,

                        new_password:
                            newPassword

                    })
                }
            );


            const data =
                await response.json();


            // ==========================================
            // CONTRASEÑA ACTUALIZADA
            // ==========================================

            if (response.ok) {

                alert(
                    "¡Contraseña actualizada con éxito! " +
                    "Ahora puedes iniciar sesión con tu nueva contraseña."
                );


                window.location.href =
                    "login.html";


            } else {

                alert(
                    data.detail ||
                    "Error al cambiar la contraseña. " +
                    "Es posible que el token haya expirado."
                );
            }


        } catch (error) {

            console.error(
                "Error:",
                error
            );

            alert(
                "No se pudo conectar con el servidor."
            );
        }

    });

</script>

</body>

</html>
