<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conviértete en Proveedor - PAT</title>
    
    <style>
        :root {
            --primary: #10b981;
            --primary-hover: #059669;
            --dark: #0f172a;
            --gray-600: #475569;
            --gray-200: #e2e8f0;
            --white: #ffffff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f8fafc;
            color: var(--dark);
            min-height: 100vh;
            padding: 30px 20px;
        }

        .container {
            max-width: 680px;
            margin: 0 auto;
            background: var(--white);
            border: 1px solid var(--gray-200);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 26px;
        }

        .badge-icon {
            width: 50px;
            height: 50px;
            background: #ecfdf5;
            color: #059669;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 24px;
            margin: 0 auto 12px;
        }

        h1 { font-size: 24px; font-weight: 800; color: #065f46; margin-bottom: 6px; }
        p { font-size: 14px; color: var(--gray-600); }

        .form-group { margin-bottom: 16px; }
        label { display: block; font-size: 13px; font-weight: 700; color: #334155; margin-bottom: 6px; }
        input, select {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--gray-200);
            border-radius: 8px;
            font-size: 14px;
            background: #f8fafc;
            outline: none;
        }
        input:focus, select:focus {
            background: var(--white);
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(16,185,129,0.15);
        }

        .checkbox-group {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 10px;
            background: #f8fafc;
            border: 1px solid var(--gray-200);
            padding: 14px;
            border-radius: 10px;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 10px;
        }
        .btn-submit:hover { background: var(--primary-hover); }

        .btn-back {
            display: block;
            text-align: center;
            margin-top: 16px;
            color: var(--gray-600);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="badge-icon">💼</div>
            <h1>Únete como Proveedor PAT</h1>
            <p>Registra tu empresa o servicio turístico para empezar a recibir reservas en Colombia.</p>
        </div>

        <form id="formProveedor">
            <div class="form-group">
                <label for="nit">NIT o Identificación Tributaria:</label>
                <input type="text" id="nit" placeholder="Ej: 900123456-1" required>
            </div>

            <div class="form-group">
                <label for="razonSocial">Razón Social o Nombre Comercial:</label>
                <input type="text" id="razonSocial" placeholder="Ej: Hotel Caribeño S.A.S." required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono de Contacto:</label>
                <input type="tel" id="telefono" placeholder="Ej: 3201234567" required>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="form-group">
                    <label for="banco">Banco:</label>
                    <input type="text" id="banco" placeholder="Ej: Bancolombia" required>
                </div>
                <div class="form-group">
                    <label for="cuenta">Número de Cuenta Bancaria:</label>
                    <input type="text" id="cuenta" placeholder="Ej: 123456789" required>
                </div>
            </div>

            <div class="form-group">
                <label>Servicios que ofrecerás (Selecciona al menos uno):</label>
                <div class="checkbox-group">
                    <label class="checkbox-label"><input type="checkbox" name="servicios" value="1"> 🏨 Hospedaje</label>
                    <label class="checkbox-label"><input type="checkbox" name="servicios" value="2"> 🍽️ Gastronomía</label>
                    <label class="checkbox-label"><input type="checkbox" name="servicios" value="3"> 🏖️ Recreación</label>
                    <label class="checkbox-label"><input type="checkbox" name="servicios" value="4"> 🚌 Transporte</label>
                    <label class="checkbox-label"><input type="checkbox" name="servicios" value="5"> 🗺️ Guías</label>
                </div>
            </div>

            <button type="submit" class="btn-submit">Enviar Solicitud para Revisión →</button>
        </form>

        <a href="menu_usuario.html" class="btn-back">← Volver al Menú de Usuario</a>
    </div>

    <script>
        const API_URL = "http://127.0.0.1:8000";
        const token = localStorage.getItem("token");

        document.getElementById("formProveedor").addEventListener("submit", async (e) => {
            e.preventDefault();

            if (!token) {
                alert("Debes iniciar sesión para postularte como proveedor.");
                window.location.href = "../login.html";
                return;
            }

            const checkedBoxes = Array.from(document.querySelectorAll("input[name='servicios']:checked"));
            const tiposIds = checkedBoxes.map(cb => parseInt(cb.value));

            if (tiposIds.length === 0) {
                alert("Por favor selecciona al menos un tipo de servicio a ofrecer.");
                return;
            }

            const bodyData = {
                nit: document.getElementById("nit").value.trim(),
                razon_social: document.getElementById("razonSocial").value.trim(),
                telefono_contacto: document.getElementById("telefono").value.trim(),
                cuenta_bancaria: document.getElementById("cuenta").value.trim(),
                banco: document.getElementById("banco").value.trim(),
                tipos_servicio_ids: tiposIds
            };

            try {
                const res = await fetch(`${API_URL}/solicitudes-proveedor/`, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                        "Authorization": `Bearer ${token}`
                    },
                    body: JSON.stringify(bodyData)
                });

                const data = await res.json();
                if (res.ok) {
                    alert("¡Solicitud enviada con éxito! El administrador del sistema la revisará pronto.");
                    window.location.href = "menu_usuario.html";
                } else {
                    alert(data.detail || "Error al enviar la solicitud.");
                }
            } catch (err) {
                console.error(err);
                alert("¡Solicitud registrada de forma simulada! En producción se envía a FastAPI.");
                window.location.href = "menu_usuario.html";
            }
        });
    </script>
</body>
</html>
