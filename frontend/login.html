<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/styles_login.css">
    <link rel="icon" type="image/png" href="./img/Designer_icon.png">
</head>
<body>
<div class="form-container">
    <h2>Login</h2>
    <form id="loginForm">
        <div class="input-box">
            <input type="email" id="email" placeholder=" " required>
            <span>Email</span>
        </div>

        <div class="input-box">
            <input type="password" id="password" placeholder=" " required>
            <span>Password</span>
        </div>

        <button type="submit" class="submit-btn">Login</button>
    </form>

    <div class="login-link">
        <p style="color:#fff; margin-top:15px;">
            ¿Olvidaste tu contraseña? <a href="solicitar_recuperacion.html">Recuperar</a>
        </p>
        <p style="color:#fff; margin-top:10px;">
            ¿No tienes cuenta? <a href="registro.html">Regístrate</a>
        </p>
    </div>
</div>

<script src="js/login.js"></script>
</body>
</html>
