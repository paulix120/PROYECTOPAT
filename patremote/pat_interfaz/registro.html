<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="css/styles_registro.css">
  <link rel="icon" type="image/png" href="./img/Designer_icon.png">
</head>
<body>
  <div class="form-container">
    <h2>Crear cuenta</h2>
    <form>
      <div class="input-box">
        <input type="email" placeholder=" " required>
        <span>Email</span>
      </div>
      <div class="input-box">
        <input type="password" placeholder=" " required>
        <span>Crear contraseña</span>
      </div>
      <div class="input-box">
        <input type="password" placeholder=" " required>
        <span>Confirmar contraseña</span>
      </div>
      <button type="submit" class="submit-btn">Signup</button>
    </form>

    <div class="login-link">
      <p style="color:#fff; margin-top:15px;">¿Ya tienes cuenta? <a href="login.html">Login</a></p>
    </div>

    <div class="divider">Or</div>

    <button class="social-btn facebook">
      <img src="./img/Facebook-Logo-sin-fon.png" alt="Facebook" class="icon">
      Login con Facebook
    </button>

    <button class="social-btn google">
      <img src="./img/google-logo-sin-fon.png" alt="Google" class="icon">
      Login con Google
    </button>
  </div>
</body>
</html>
